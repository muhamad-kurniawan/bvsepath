[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bvsepath"
version = "0.2.1"
description = "General BVSE energy-landscape and periodic ion-pathway analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10"
]

[project.scripts]
bvse-landscape = "bvsepath.cli_landscape:main"
bvse-pathway = "bvsepath.cli_pathway:main"

[tool.setuptools.package-data]
"bvsepath.data" = ["elements.dat", "bvse.dat"]
